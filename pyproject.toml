[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "midi-pianoswitcher"
version = "0.2.1"
description = "把任意 MIDI 转成纯钢琴版：音频 + MIDI + 可打印钢琴谱，自带乐谱结构校验"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MIDI-PianoSwitcher contributors" }]
keywords = ["midi", "piano", "musicxml", "musescore", "transcription", "audio", "music"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

dependencies = [
  "mido>=1.2",
  "pretty_midi>=0.2.10",
  "numpy>=1.24",
  "soundfile>=0.12",
  "scipy>=1.10",
  "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist"]

[project.urls]
Homepage = "https://github.com/misaka11451-blip/MIDI-PianoSwitcher"
Issues = "https://github.com/misaka11451-blip/MIDI-PianoSwitcher/issues"

[project.scripts]
# 完整命令（与项目名一致）
midi-pianoswitcher = "midi_pianoswitcher.runner:main"
midi-pianoswitcher-gui = "midi_pianoswitcher.webapp:main"
midi-pianoswitcher-batch = "midi_pianoswitcher.batch:main"
midi-pianoswitcher-audio2midi = "midi_pianoswitcher.audio2midi:main"
# 简写别名（打起来方便，功能完全等价）
mps = "midi_pianoswitcher.runner:main"
mps-gui = "midi_pianoswitcher.webapp:main"
mps-batch = "midi_pianoswitcher.batch:main"
mps-audio2midi = "midi_pianoswitcher.audio2midi:main"

[tool.hatch.build.targets.wheel]
# 只声明这一条就够了：packages 会把 src/midi_pianoswitcher 下的**所有**文件
# （含 web/static 里的 html/css/js）都打进 wheel。
#
# 千万别再写 force-include 把 web/static 再塞一次 —— 同一个文件会被加入两次，
# 构建 wheel 时报 "A second file is being added to the wheel archive at the
# same path"。这个坑可编辑安装（pip install -e .）不会暴露，只有普通用户
# 的 pip install . 才会炸。已实测。
packages = ["src/midi_pianoswitcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
